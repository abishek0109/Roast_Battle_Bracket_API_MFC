services:
  - type: web
    name: roast-battle-bracket-api
    env: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: node dist/server.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 24h
      - key: CORS_ORIGIN
        value: "*"
      - key: VOTING_DURATION_SECONDS
        value: 300
      - key: MATCHUP_SCHEDULER_INTERVAL_MS
        value: 3000
      - key: ALLOW_LIVE_VOTE_COUNTS
        value: false
      - key: DATABASE_URL
        fromDatabase:
          name: roast-battle-db
          property: connectionString

databases:
  - name: roast-battle-db
    plan: free
    databaseName: roast_battle
    user: roast_user
